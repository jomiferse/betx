[project]
name = "betx-ml"
version = "0.1.0"
description = "Offline football probability baseline for BetX"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pytest>=8.0",
    "scikit-learn>=1.5",
]

[project.scripts]
betx-ml = "betx_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betx_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
